<head>

  <title>Programa Candidato de Elite | Condição especial</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Identidade da página /VSL (Você Contratado). Dourado do PCE só no botão e na logo. */
    :root {
      --petrol-950:#081f22; --petrol-900:#0d2e32; --petrol-700:#174c53; --petrol-600:#1c5c64; --petrol-100:#dbebec;
      --ink-900:#363636; --ink-700:#55535f; --ink-500:#6f6d7a; --ink-300:#a9b0b2; --ink-200:#d3d8d9; --ink-100:#e9ecec;
      --paper:#ffffff; --paper-warm:#fbfbfa;

      --gold-700:#7f6136; --gold-600:#94744a; --gold-500:#ab8b5a; --gold-400:#bf9f6c;

      --font:'Inter',-apple-system,'Segoe UI',sans-serif;
      --text-body:1.0625rem; --text-lg:1.125rem; --text-xl:1.375rem; --text-sm:0.9375rem; --text-xs:0.8125rem;
      --radius-md:8px; --radius-lg:14px; --radius-full:999px;
      --shadow-lg:0 12px 32px rgba(20,24,26,0.12);
      --fire:#d62f1f; --no:#d63a2f;
    }

    *, *::before, *::after { box-sizing: border-box; }
    h1, h2, h3, p, ul { margin: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink-900);
      font-family: var(--font);
      font-size: var(--text-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 56px; }

    .ico { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .star { display: inline-block; width: 12px; height: 12px; flex: none; color: currentColor; }

    /* ============ TOPO ============ */
    .head { text-align: center; }

    .head h1 {
      font-weight: 800;
      font-size: clamp(1.9rem, 1.4rem + 2.2vw, 2.75rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .head p { font-size: var(--text-body); color: var(--ink-700); margin-top: 12px; }

    /* ============ VÍDEO (VTurb) ============ */
    .video { max-width: 400px; margin: 20px auto 0; }

    .video-label { text-align: center; font-size: var(--text-xs); font-weight: 600; color: var(--ink-700); margin-bottom: 10px; }

    /* Mesmo acabamento do player da página /VSL */
    .video vturb-smartplayer { border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 12px 32px rgba(8,31,34,.25); }

    .video-placeholder {
      display: flex;
      aspect-ratio: 9 / 16;
      width: 100%;
      margin: 0 auto;
      border: 2px dashed var(--ink-200);
      border-radius: var(--radius-lg);
      background: var(--paper-warm);
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--ink-500);
      font-size: var(--text-sm);
      font-weight: 600;
    }

    .video.tem-vsl .video-placeholder { display: none; }

    /* ============ CARTÃO DA OFERTA ============ */
    /* "esconder" é a classe do delay do VTurb: some até o segundo do pitch */
    .esconder { display: none; }

    .cta-topo { max-width: 400px; margin: 4px auto 0; }

    .offer {
      margin-top: 32px;
      border: 1px solid var(--ink-300);
      border-radius: var(--radius-lg);
      background: var(--paper);
      padding: 28px 20px 24px;
      box-shadow: var(--shadow-lg);
    }

    .offer__logo { display: block; width: 160px; height: auto; margin: 0 auto; }

    .promise {
      margin-top: 18px;
      text-align: center;
      font-size: var(--text-xl);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.25;
      text-wrap: balance;
    }

    .promise span { color: #9c7b4b; }

    .intro { margin-top: 8px; text-align: center; font-size: var(--text-sm); color: var(--ink-700); }
    .intro strong { color: var(--ink-900); font-weight: 700; }

    /* Entregáveis */
    .items { list-style: none; padding: 0; margin: 22px 0 0; display: flex; flex-direction: column; gap: 10px; }

    .item {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--ink-200);
      background: var(--paper-warm);
    }

    /* Ícones coloridos e cheios */
    .item__icon {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      color: var(--paper);
      box-shadow: 0 4px 10px rgba(20,24,26,.16), inset 0 1px 0 rgba(255,255,255,.25);
    }

    .item__icon svg { width: 26px; height: 26px; }
    .item__icon--mic svg { width: 32px; height: 32px; }

    /* Paleta análoga e viva (azul, turquesa, índigo, verde): mesma saturação e luminosidade,
       ancorada nas cores do LinkedIn e do WhatsApp. */
    .item__icon--li  { background: linear-gradient(145deg, #1a85e8, #0a66c2); --glyph: #0a66c2; }
    .item__icon--mic { background: linear-gradient(145deg, #22c1c3, #0d8f9a); --glyph: #0d8f9a; }
    /* Biblioteca: mesma cor do ícone de Treinamento */
    .item__icon--vid { background: linear-gradient(145deg, #22c1c3, #0d8f9a); }

    .item__icon--vid svg { width: 30px; height: 30px; }
    .item__icon--wa  { background: linear-gradient(145deg, #3ad677, #14a85a); --glyph: #14a85a; }

    /* Selo de verificado no LinkedIn */
    .item__badge {
      position: absolute;
      right: -5px;
      bottom: -5px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #0b8f47;
      border: 2px solid var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .item__badge svg { width: 11px; height: 11px; }

    .item__title { display: block; font-size: var(--text-body); font-weight: 700; line-height: 1.3; }

    /* Bônus: etiqueta acima do título e presente à direita */
    .item__body { flex: 1; min-width: 0; }

    .item__bonus {
      display: block;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94744a;
      margin-bottom: 2px;
    }

    .item__gift { flex: none; font-size: 22px; line-height: 1; align-self: flex-start; margin-top: 2px; }
    .item__text  { display: block; font-size: var(--text-xs); color: var(--ink-500); line-height: 1.45; margin-top: 2px; }

    /* Preço */
    .price { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--ink-200); text-align: center; }
    .price__from { font-size: var(--text-body); font-weight: 500; color: var(--ink-700); }
    .price__from s { font-weight: 700; text-decoration-color: var(--no); text-decoration-thickness: 2px; }

    .price__main {
      font-size: clamp(2.5rem, 1.9rem + 2.4vw, 3.25rem);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 4px 0 2px;
    }

    .price__main small { font-size: 0.38em; font-weight: 700; letter-spacing: 0; color: var(--ink-700); }
    .price__inst { font-size: var(--text-body); font-weight: 700; color: var(--ink-700); }
    .price__note { margin-top: 10px; font-size: var(--text-xs); font-weight: 600; color: var(--ink-700); }

    /* Botão dourado (cor da logo PCE) */
    .btn {
      font-family: var(--font);
      font-size: var(--text-body);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 58px;
      margin-top: 18px;
      padding: 14px 16px;
      white-space: nowrap;
      border-radius: var(--radius-md);
      cursor: pointer;
      line-height: 1.3;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: #0b8f47;
      border: 1px solid transparent;
      color: var(--paper);
      font-weight: 800;
      box-shadow: 0 6px 18px rgba(11,143,71,.28);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    /* Verde do botão da página /VSL */
    .btn:hover  { background: #087a3c; }
    .btn:active { background: #066a33; transform: scale(0.985); }
    .btn:focus-visible { outline: 2px solid var(--petrol-700); outline-offset: 3px; }

    .btn::after {
      content: "";
      position: absolute;
      top: 0; left: -60%;
      width: 45%; height: 100%;
      z-index: -1;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,.5), transparent);
      transform: skewX(-20deg);
      animation: shine 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    /* Botão de recusa: mesmo tamanho do principal, visual neutro */
    .btn-no {
      font-family: var(--font);
      font-size: var(--text-body);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--ink-300);
      background: var(--paper);
      color: var(--ink-700);
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .btn-no:hover { background: var(--ink-100); color: var(--ink-900); }

    /* Rodapé com a logo do PCE */
    .footer { border-top: 1px solid var(--ink-200); padding: 28px 16px 36px; text-align: center; }
    .footer img { width: 120px; height: auto; display: inline-block; }

    @keyframes shine   { 0% { left: -60%; } 45%, 100% { left: 130%; } }
    @keyframes entrada { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .btn::after { animation: none; }
    }

    @media (min-width: 720px) {
      .wrap { padding: 48px 24px 72px; }
      .head p { font-size: var(--text-lg); }
      .offer { padding: 36px 36px 28px; }
    }
    /* ============ DOWNSELL: duas opções ============ */
    .options { display: flex; flex-direction: column; gap: 16px; margin-top: 22px; }

    .option {
      position: relative;
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-lg);
      background: var(--paper-warm);
      padding: 18px 16px 16px;
    }

    .option__tag {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 10px;
    }

    .option__head { display: flex; gap: 14px; align-items: center; }

    .option__list { list-style: none; padding: 0; margin: 14px 0 0; display: flex; flex-direction: column; gap: 6px; }
    .option__list li { display: flex; gap: 8px; align-items: flex-start; font-size: var(--text-sm); color: var(--ink-700); line-height: 1.45; }
    .option__list svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: #0b8f47; }

    .option .price { margin-top: 16px; padding-top: 14px; }
    .option .price__main { font-size: clamp(2rem, 1.6rem + 1.8vw, 2.5rem); }
    .option .btn { margin-top: 14px; }

    .botoes { max-width: 400px; margin: 20px auto 0; }
    /* Downsell: sem o brilho passando; texto pode quebrar em duas linhas */
    .botoes .btn { white-space: normal; text-align: center; }
    .botoes .btn::after { display: none; }
    /* Botão do LinkedIn na cor da marca */
    .btn--li { background: #0a66c2; box-shadow: 0 6px 18px rgba(10,102,194,.28); }
    .btn--li:hover { background: #004182; }
    .btn--li:active { background: #00336a; }

    /* Botões do downsell: mesma largura da VSL, mesma altura, ícone dentro do botão */
    .escolha { text-align: center; font-size: var(--text-body); font-weight: 700; color: var(--ink-900); margin-bottom: 6px; }
    .botoes .btn + .btn { margin-top: 12px; }
    .preco-unico { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 14px; }
    .preco-unico__parc { font-size: var(--text-sm); font-weight: 600; color: var(--ink-700); }
    .preco-unico strong { font-size: var(--text-lg); font-weight: 800; color: var(--ink-900); }
    .preco-unico__off { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.04em; padding: 3px 9px; border-radius: var(--radius-full); background: var(--petrol-100); color: var(--petrol-700); }

    .botoes .btn,
    .botoes .btn-no { position: relative; height: 68px; min-height: 0; margin-top: 0; padding: 8px 52px; font-size: 0.9375rem; }
    .botoes .btn-no { margin-top: 12px; }
    .btn__texto { display: block; flex: 1; text-align: center; line-height: 1.25; }
    .btn__icone {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn__icone svg { width: 22px; height: 22px; }
    .btn--li .btn__icone { color: #0a66c2; }
    .btn:not(.btn--li) .btn__icone { color: #0b8f47; }
    .head p strong { color: var(--ink-900); }
    .offer__note { margin-top: 18px; text-align: center; font-size: var(--text-xs); font-weight: 600; color: var(--ink-700); }
  </style>

<script>
  // ===== CONFIGURAÇÃO =====
  // Segundo da VSL em que a oferta aparece (pitch). Atualizar quando o vídeo do VTurb ficar pronto.
  var CTA_TEMPO = 70; // 1:10 da VSL do downsell
  // Links one-click da Greenn de cada opção (cada oferta libera a sua turma no Club).
  var ONE_CLICK = {
    linkedin:    "https://payfast.greenn.com.br/one-click/7843",   // Opção A: LinkedIn feito (oferta 492127)
    entrevistas: "https://payfast.greenn.com.br/one-click/7844"    // Opção B: Treinamento de entrevistas (oferta 492128)
  };
  // Para onde vai quem recusa.
  var DECLINE_URL = "https://vc.formuladaentrevista.com.br/obrigado";
  // =========================

  // Link de recusa: repassa a query string (token da Greenn) e registra o evento
  (function () {
    var link = document.getElementById("not-buy-link");
    link.href = DECLINE_URL + window.location.search;
    link.addEventListener("click", function () {
      if (typeof fbq !== 'undefined') fbq('trackCustom', 'DownsellDecline');
    });
  })();

  // Tempo na página: captura quem lê mas não assiste o vídeo
  [30, 60, 120, 180].forEach(function (s) {
    setTimeout(function () {
      if (typeof fbq !== 'undefined') fbq('trackCustom', 'TimeOnPage' + s + 's');
    }, s * 1000);
  });

  // Compra em 1 clique: trava duplo clique e repassa o token da Greenn
  window.startLoading = function (button) {
    var url = ONE_CLICK[button.getAttribute('data-oferta')];
    if (!url) { console.warn('Link one-click desta opção ainda não foi configurado.'); return; }
    if (button.getAttribute('data-loading') === 'true') return;
    document.querySelectorAll('.cta-button').forEach(function (b) { b.setAttribute('data-loading', 'true'); });
    if (typeof fbq !== 'undefined') fbq('track', 'InitiateCheckout', { content_name: button.getAttribute('data-oferta') });
    button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><path fill="#ffffff" d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z" opacity=".25"/><path fill="#ffffff" d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12h0a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12h0a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z"><animateTransform attributeName="transform" dur="0.75s" repeatCount="indefinite" type="rotate" values="0 12 12;360 12 12"/></path></svg>';
    setTimeout(function () {
      window.location.href = url + window.location.search;
    }, 400);
  };

  // Delay da oferta pelo VTurb: os elementos com a classe "esconder" aparecem no segundo CTA_TEMPO
  (function () {
    var player = document.querySelector("vturb-smartplayer");
    if (!player) {
      // Sem VSL ainda: mostra a oferta direto
      document.querySelectorAll(".esconder").forEach(function (el) { el.classList.remove("esconder"); });
      return;
    }
    document.getElementById("vsl").classList.add("tem-vsl");
    player.addEventListener("player:ready", function () {
      player.displayHiddenElements(CTA_TEMPO, [".esconder"], { persist: true });
    });
  })();
</script>
