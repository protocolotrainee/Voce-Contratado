<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Você Contratado — Compra Confirmada</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* === Tokens === */
    :root {
      --petrol-700: #174c53;
      --petrol-800: #123d42;
      --petrol-900: #0d2e32;

      --ink-900: #14181a;
      --ink-500: #6b7376;
      --ink-200: #d3d8d9;
      --paper:      #ffffff;
      --paper-warm: #fbfbfa;

      --color-bg:           var(--paper-warm);
      --color-text:         var(--ink-900);
      --color-text-muted:   var(--ink-500);
      --color-border:       var(--ink-200);
      --color-accent:       var(--petrol-700);
      --color-accent-hover: var(--petrol-900);

      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans:  'Manrope', system-ui, -apple-system, sans-serif;

      --radius-card: 16px;
    }

    /* === Reset === */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100dvh;
    }

    /* === Layout mobile (padrão) === */
    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 24px;
      text-align: center;
      animation: fadeIn 0.5s ease both;
    }

    /* === Logo === */
    .logo {
      height: 72px;
      width: auto;
      margin-bottom: 44px;
    }

    /* === Badge "Compra confirmada" === */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      margin-bottom: 28px;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--color-text);
    }

    .badge svg {
      width: 15px;
      height: 15px;
      color: var(--color-accent);
      flex-shrink: 0;
    }

    /* === Título === */
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.75rem, 8vw, 4.5rem);
      line-height: 1.05;
      font-weight: 500;
      margin: 0 0 20px;
    }

    /* === Textos === */
    .lead {
      font-size: clamp(1rem, 3vw, 1.25rem);
      line-height: 1.5;
      max-width: 480px;
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }

    .body-text {
      font-size: clamp(0.9375rem, 2.5vw, 1.0625rem);
      line-height: 1.65;
      max-width: 480px;
      color: var(--color-text-muted);
      margin-top: 28px;
    }

    .closing {
      font-size: clamp(0.9375rem, 2.5vw, 1.0625rem);
      line-height: 1.65;
      margin: 6px 0 56px;
    }

    /* === Bloco de ajuda === */
    .help {
      width: 100%;
      max-width: 400px;
      border-top: 1px solid var(--color-border);
      padding-top: 28px;
    }

    .help-label {
      font-size: 0.9375rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .help-text {
      font-size: 0.9375rem;
      line-height: 1.65;
      color: var(--color-text-muted);
    }

    a {
      color: var(--color-accent);
      text-decoration: underline;
    }

    a:hover { color: var(--color-accent-hover); }

    /* === Copyright === */
    .copyright {
      font-size: 0.8125rem;
      color: var(--ink-500);
      opacity: 0.65;
      margin-top: 64px;
    }

    /* === Animação de entrada === */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; }
    }

    /* === Desktop (≥ 640px) === */
    @media (min-width: 640px) {
      body {
        background-color: #f0f1f2;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }

      .page {
        min-height: unset;
        background-color: var(--paper-warm);
        border-radius: var(--radius-card);
        box-shadow: 0 4px 48px rgba(0, 0, 0, 0.08);
        padding: 72px 64px 64px;
        max-width: 640px;
        width: 100%;
      }

      .logo {
        height: 96px;
        margin-bottom: 52px;
      }

      .closing {
        margin-bottom: 64px;
      }
    }

    /* === iOS safe area === */
    @supports (padding: env(safe-area-inset-bottom)) {
      .page {
        padding-bottom: max(56px, calc(env(safe-area-inset-bottom) + 32px));
      }
    }
  </style>

  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;

</head>
<body>

<main class="page">

  <img src="/obrigado/logo-black.png" alt="Você Contratado" class="logo">

  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
    Compra confirmada
  </div>

  <h1>Parabéns!</h1>

  <p class="lead">O seu caminho para a aprovação começa agora.</p>

  <p class="body-text">O acesso ao conteúdo está a caminho do seu email.</p>

  <p class="closing">Boas entrevistas!</p>

  <div class="help">
    <p class="help-label">Precisa de ajuda?</p>
    <p class="help-text">
      Entre em contato com a nossa equipe:<br>
      <a href="mailto:contato.molinos@gmail.com">contato.molinos@gmail.com</a>
    </p>
  </div>

  <p class="copyright">© 2026 Você Contratado · Todos os direitos reservados</p>

</main>

</body>
</html>
